spring:
  application:
    name: LearnMate

  # Dev tools would otherwise turn on stack traces in error responses
  # (overriding server.error below) whenever the app runs via spring-boot:run.
  devtools:
    add-properties: false

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  servlet:
    multipart:
      # Full textbooks with pictures run to 150 MB+. Uploads are streamed to a
      # temp file on disk (not memory), so this mostly needs free disk space.
      # A proxy in front of the app (nginx client_max_body_size) needs the same limit.
      max-file-size: 200MB
      max-request-size: 210MB

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}
  # Never send Java stack traces to the browser (dev tools turn them on otherwise).
  error:
    include-stacktrace: never

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-32chars}
  expiration-ms: 86400000

learnmate:
  llm:
    provider: anthropic
    anthropic:
      model: claude-sonnet-5
      temperature: 0.3

anthropic:
  api-key: ${ANTHROPIC_API_KEY}

logging:
  level:
    com.learnmate.learnmateai: DEBUG
    org.springframework.ai: INFO

voyage:
  api-key: ${VOYAGE_API_KEY}
