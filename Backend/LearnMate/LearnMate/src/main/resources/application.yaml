spring:
  application:
    name: LearnMate

  # Dev tools would otherwise turn on stack traces in error responses
  # (overriding server.error below) whenever the app runs via spring-boot:run.
  devtools:
    add-properties: false

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  servlet:
    multipart:
      # Full textbooks with pictures run to 150 MB+. Uploads are streamed to a
      # temp file on disk (not memory), so this mostly needs free disk space.
      # A proxy in front of the app (nginx client_max_body_size) needs the same limit.
      max-file-size: 200MB
      max-request-size: 210MB

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}
  # Never send Java stack traces to the browser (dev tools turn them on otherwise).
  error:
    include-stacktrace: never

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-32chars}
  expiration-ms: 86400000

learnmate:
  llm:
    provider: anthropic
    anthropic:
      model: claude-sonnet-5
      temperature: 0.3
  # AI cost control (see AiUsageService).
  ai:
    daily-limit:
      student: ${AI_DAILY_LIMIT_STUDENT:60}  # questions per student per day; a school can override; 0 = none
      staff: ${AI_DAILY_LIMIT_STAFF:0}       # teachers and admins; 0 = none
    price:                                   # for the usage report's cost estimate
      input-per-mtok: ${AI_PRICE_INPUT:}     # US$ per million tokens; empty = list price of the model above
      output-per-mtok: ${AI_PRICE_OUTPUT:}
      image-usd: ${AI_PRICE_IMAGE:0.003}     # US$ per story picture
      usd-to-inr: ${AI_USD_TO_INR:88}
  # Picture-book stories (see StoryService). Pictures need a Replicate API token.
  stories:
    replicate:
      token: ${REPLICATE_API_TOKEN:}
      model: black-forest-labs/flux-schnell  # Apache 2.0 licence: commercial use allowed
    dir: ${STORIES_DIR:${user.home}/learnmate-data/stories}
    daily-limit-per-school: 20
    daily-picture-limit-per-school: 150

anthropic:
  api-key: ${ANTHROPIC_API_KEY}

logging:
  level:
    com.learnmate.learnmateai: DEBUG
    org.springframework.ai: INFO

voyage:
  api-key: ${VOYAGE_API_KEY}
