# Nightly database backup (see ops/backup/README.md).
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   DATABASE_URL        postgresql://user:pass@host:5432/dbname?sslmode=require
#   BACKUP_PASSPHRASE   long random passphrase; also store it somewhere safe
#                       outside GitHub, because restores need it
# Each run keeps the encrypted backup as a workflow artifact for 30 days.
# For one copy per school, add a job (or a copy of this file) per school with
# that school's secrets.

name: Database backup

on:
  schedule:
    - cron: "30 20 * * *" # 20:30 UTC = 02:00 IST
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    # pg_dump must be at least as new as the database server; 17 covers servers up to 17.
    container: postgres:17
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$DATABASE_URL" ] || { echo "Add the DATABASE_URL secret."; exit 1; }
          # Never upload an unencrypted copy of student data.
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "Add the BACKUP_PASSPHRASE secret."; exit 1; }

      - name: Install openssl
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends openssl >/dev/null

      - name: Back up
        id: backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_DIR: backups
        run: echo "file=$(bash ops/backup/backup-db.sh)" >> "$GITHUB_OUTPUT"

      - name: Keep backup for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: learnmate-db-${{ github.run_id }}
          path: ${{ steps.backup.outputs.file }}
          retention-days: 30
          if-no-files-found: error
